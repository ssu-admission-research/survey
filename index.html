<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>대학입학전형 회피·배제 운영방식 및 개선 요구 조사</title>
<script>
/* 설정: Apps Script 웹앱의 /exec 주소 */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwQ53FsJh8vV3tMr3HRva2qlyoXACRd4BB3AYeQV3h7HtDdb0wXuPLeekulvnyDC_0u/exec';
</script>
<script src="schema.js"></script>
<style>
:root{--navy:#1b3a6b;--blue:#1d4ea8;--line:#c5c9d0;--line2:#e2e4e8;--th:#f1f2f4;--text:#222;--muted:#666;--red:#b42318}
html{font-size:15px;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:#fff;line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%}
body{margin:0}*{box-sizing:border-box}
p{margin:6px 0}a{color:var(--navy)}
button{font:inherit;font-size:14px;cursor:pointer;color:#333;background:#fff;border:1px solid #999;padding:0 18px;height:38px}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.link{border:0;background:none;height:auto;padding:0;color:#555;text-decoration:underline;font-size:13px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:6px 10px;z-index:9;border:2px solid var(--navy)}
:focus-visible{outline:2px solid #1a5fb4;outline-offset:2px}
.in{max-width:1040px;margin:0 auto;padding:0 16px}

/* 검토용 표시: 시험 운영 중에만 보임. 본조사에서는 지울 문구는 사라지고 새 문구는 일반 글씨 */
del{display:none}ins{text-decoration:none;color:inherit}
body.marks del{display:inline;color:var(--red);text-decoration:line-through}
body.marks ins{color:var(--blue);text-decoration:underline;text-underline-offset:3px}

.top{border-top:4px solid var(--navy);border-bottom:1px solid var(--line2);font-size:13px;color:var(--muted)}
.top .in{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.tools button{height:24px;padding:0 8px;font-size:12px;margin-left:2px}
.head .in{padding-top:22px;padding-bottom:16px}
.head h1{margin:0;font-size:23px;letter-spacing:-.5px}
.head p{margin:4px 0 0;font-size:13px;color:var(--muted)}

main.in{padding-bottom:80px}
.testline{border:1px solid #e3b5b0;color:var(--red);font-size:13px;padding:6px 10px;margin:4px 0 0}
.testline .legend{color:#555}
.secbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--navy);padding:18px 0 8px}
h2{margin:0;font-size:19px;color:var(--navy)}h2:focus{outline:none}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.track{display:inline-block;width:160px;height:8px;background:#e3e6ea}
.track i{display:block;height:100%;background:var(--navy);transition:width .3s}

.lead{margin:14px 0 4px}
.lead h4{font-size:15px;margin:18px 0 4px}.lead h4::before{content:"□ "}
.lead .note{font-size:14px;color:#444;padding-left:1.2em;text-indent:-1.2em;margin:2px 0}
.lead .note:last-of-type{margin-bottom:14px}
.org{font-size:13px;color:var(--muted)}
.info-table{width:100%;border-collapse:collapse;border-top:2px solid #555;font-size:14px;margin:10px 0}
.info-table th,.info-table td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.info-table th{background:var(--th);width:150px;font-weight:600;border-right:1px solid var(--line)}

.case{border:1px solid var(--line);margin:16px 0 6px;background:#fff}
.case>h3{margin:0;padding:8px 14px;background:var(--th);border-bottom:1px solid var(--line);font-size:15px}
.case .cbody{padding:10px 16px;font-size:14.5px}
.case .cnote{font-size:13px;color:#555;padding-left:1.2em;text-indent:-1.2em;margin:4px 0}
.case .cbody p:first-child + .cnote{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.case.notes .cbody p{padding-left:1.1em;text-indent:-1.1em}
.case.notes .cbody p::before{content:"○ "}
.warn{margin:16px 0 -8px;color:var(--blue);font-weight:700;font-size:14px;padding-left:1.2em;text-indent:-1.2em}
.warn::before{content:"※ "}
.cl2 .q:first-child{padding-top:16px}

.q{padding:20px 0 16px;border-bottom:1px solid var(--line2)}
.q:last-of-type{border-bottom:0}
.q h3{margin:0 0 6px;font-size:15.5px;font-weight:700}
.rule{color:#222;font-size:14px;font-weight:700;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.q.miss h3::after{content:"  ← 응답이 필요합니다";color:var(--red);font-size:13px;font-weight:400;white-space:nowrap}
.help{font-size:13.5px;color:#555;margin:0 0 10px}
.help p{margin:1px 0;padding-left:1.2em;text-indent:-1.2em}
.help p::before{content:"※ "}
.help strong{color:#222}
strong{font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
strong.imp{color:var(--blue)}
.lead strong:not(.imp){text-decoration:none}
u.k{text-underline-offset:3px;text-decoration-thickness:1px}
.help.after{margin-top:18px}

/* 보기: 번호를 눌러 고르는 설문지형 */
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));column-gap:20px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:5px 4px;cursor:pointer;line-height:1.55;position:relative}
.opt:hover{background:#f6f7f9}
.opt:has(input:checked){background:#eceef1}
.grid td:has(input:checked){background:#eceef1}
.grid td .opt:has(input:checked){background:none}
.vh{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.mk{flex:0 0 auto;width:24px;height:24px;border:1.5px solid #8b929c;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#444;background:#fff;margin-top:-1px}
.mk.sq{border-radius:3px}
.opt:hover .mk{border-color:var(--navy)}
.opt input:checked+.mk{background:var(--navy);border-color:var(--navy);color:#fff}
.opt input:checked+.mk.blank:not(.sq){box-shadow:inset 0 0 0 4px #fff}
.opt input:checked+.mk.blank.sq::after{content:"✓";font-size:14px;line-height:1}
.opt input:checked~.tx{font-weight:700}
.opt input:focus-visible+.mk{outline:2px solid #1a5fb4;outline-offset:2px}
.opt input:disabled+.mk{border-style:dashed;border-color:#c3c7cd;color:#bbb}
.opt input:disabled~.tx{color:#aaa}
.opt:has(input:disabled){cursor:not-allowed}.opt:has(input:disabled):hover{background:none}

.grid{width:100%;border-collapse:collapse;border-top:2px solid #555;font-size:14px;margin-top:4px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:6px 8px;text-align:center;vertical-align:middle}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid thead th{background:var(--th);font-weight:600;font-size:13px}
.grid tbody th{text-align:left;font-weight:400;width:40%}
.grid tr.group th{background:#fafafa;font-weight:600;font-size:13px}
.grid tr.miss th::after{content:"  ← 응답 필요";color:var(--red);font-size:12.5px;white-space:nowrap}
.grid td .opt{justify-content:center;margin:-6px -8px;padding:8px}
.grid .cl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.textwrap textarea,.textwrap input{width:100%;border:1px solid #999;padding:9px 10px;font:inherit;font-size:14.5px;background:#fff;color:inherit;border-radius:0}
.textwrap textarea{min-height:150px;resize:vertical}
.textwrap textarea:disabled{background:#f3f4f6;color:#999}
.textwrap input.code{max-width:280px}
.textfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.cnt{font-size:12px;color:var(--muted)}
.confirm{margin-top:10px}

.msg{border:1px solid var(--line);background:#fafafa;padding:12px 14px;margin:16px 0;font-size:14px}
.msg.err{border-color:#e3b5b0;background:#fff;color:var(--red)}
.msg ul{margin:6px 0 6px 18px;padding:0}

.btns{display:flex;justify-content:center;gap:8px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line2)}
.btns button{min-width:110px}

.rv h3{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:22px 0 6px}
.rv table{width:100%;border-collapse:collapse;border-top:2px solid #555;font-size:13.5px}
.rv th,.rv td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.rv th{background:var(--th);font-weight:400;width:45%;border-right:1px solid var(--line)}
.rv .none{color:var(--red)}.rv .muted{color:var(--muted)}

.foot{border-top:1px solid var(--line2);background:#f7f7f8;font-size:12.5px;color:var(--muted);padding:18px 0 30px;line-height:1.7}

/* 사례: PC에서 좌우 분할(왼쪽 사례 고정) */
@media(min-width:900px){
 .cl2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start}
 .cl2 .side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
 .cl2 .opts{grid-template-columns:1fr}
}
@media(max-width:700px){
 .head h1{font-size:19px}
 .secbar{flex-wrap:wrap}
 .track{width:90px}
 .opts{grid-template-columns:1fr}
 .grid,.grid tbody,.grid tr,.grid th,.grid td{display:block;width:auto;border-right:0}
 .grid thead{display:none}
 .grid tr{border-bottom:1px solid var(--line);padding:4px 0}
 .grid tbody th{border:0;background:none;font-weight:600;padding:6px 2px 2px;width:auto}
 .grid tr.group th{background:var(--th);padding:6px 8px}
 .grid td{display:inline-block;border:0;width:49%;text-align:left;padding:0}
 .grid td .opt{justify-content:flex-start;margin:0;padding:6px 2px}
 .grid .cl{position:static;width:auto;height:auto;clip:auto}
 .info-table th{width:96px}
 .rv th,.rv td{display:block;width:auto;border-right:0}.rv th{border-bottom:0}
 .btns button{flex:1}
 .q.miss h3::after{display:block;content:"← 응답이 필요합니다"}
}
@media print{.top .tools,.btns{display:none}}
</style>
</head>
<body>
<a class="skip" href="#content">본문 바로가기</a>
<div class="top"><div class="in"><span>한국대학교육협의회 · 숭실대학교 연구진</span><span class="tools">글자크기<button type="button" data-font="-1" aria-label="글자 작게">−</button><button type="button" data-font="1" aria-label="글자 크게">＋</button></span></div></div>
<header class="head"><div class="in"><h1>대학입학전형 회피·배제 운영방식 및 개선 요구 조사</h1><p id="versionLine"></p></div></header>
<main id="content" class="in">
 <p id="loading" class="msg">설문 정보를 불러오는 중입니다.</p>
 <p id="testLine" class="testline" hidden>[시험 운영] 이 응답은 ‘시험응답’으로 저장되며 본조사 자료에 포함되지 않습니다.<br><span class="legend">검토용 표시: <del>빨간 취소선</del> 삭제 예정 문구 · <ins>파란 밑줄</ins> 새 문구 (본조사 전환 시 자동 정리)</span></p>
 <div id="workspace" hidden>
  <div class="secbar"><h2 id="pageTitle" tabindex="-1"></h2><span class="prog" aria-label="진행 상황"><span class="track"><i id="progBar" style="width:0"></i></span><span id="pageCount"></span></span></div>
  <div id="body"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="btns"><button id="prev" type="button">이전</button><button id="next" type="button" class="primary">다음</button></div>
 </div>
 <div id="done" hidden tabindex="-1"></div>
</main>
<footer class="foot"><div class="in">발주기관 한국대학교육협의회 ｜ 연구수행 숭실대학교 연구진<br>응답자의 성명·개인 직급·연락처·서명은 수집하지 않으며, 응답 내용은 다른 응답자에게 공개하지 않습니다.</div></footer>
<noscript><p class="in">이 설문에 응답하려면 브라우저에서 JavaScript를 허용해야 합니다.</p></noscript>
<script>
'use strict';
var schema=SCHEMA,config={},MODE='test';
var PREFILL=(function(){try{return String(new URLSearchParams(location.search).get('code')||'').slice(0,80);}catch(e){return '';}})();
var byId={};schema.questions.forEach(function(q){byId[q.id]=q;});
var pages=schema.pages.concat([{title:'제출 전 확인',ids:[],review:true}]);
var answers={},index=0,busy=false,pending=null,completed=false,q14Confirmed=false,STARTED=null;
function touch(){if(!STARTED)STARTED=new Date().toISOString();} /* 첫 응답 입력 시각 → 소요시간 계산용 */

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function mark(h){return String(h||'').replace(/~~([\s\S]*?)~~/g,'<del>$1</del>').replace(/\+\+([\s\S]*?)\+\+/g,'<ins>$1</ins>');}
function plain(t){return String(t||'').replace(/~~[\s\S]*?~~/g,'').replace(/\+\+([\s\S]*?)\+\+/g,'$1').replace(/__/g,'');}
function prose(s){return mark((s||'').replace(/\{\{([A-Z_]+)\}\}/g,function(_,k){return esc(config[k]||'[승인 후 기재]');}));}
function fieldsOf(q){return q.rows?q.rows.map(function(r){return {id:r.id,label:r.label};}):[{id:q.id,label:''}];}
function hasValue(v){return Array.isArray(v)?v.length>0:String(v==null?'':v).trim()!=='';}
function skip(id){
 if(id==='Q3')return (answers.Q2||[]).indexOf('5')>=0;
 if(id==='Q9'||id==='Q13')return answers.Q1_1==='2';
 if(id==='url1'||id==='url2')return answers.material_mode!=='1';
 if(id==='F1_kind')return answers.F1_none==='1'||!hasValue(answers.F1);
 if(id==='F2_kind')return answers.F2_none==='1'||!hasValue(answers.F2);
 return false;
}
function optional(id){
 if(id==='url2')return true;
 if(id==='F1')return answers.F1_none==='1';
 if(id==='F2')return answers.F2_none==='1';
 return false;
}
function clearQ(id){fieldsOf(byId[id]).forEach(function(f){delete answers[f.id];});}
function sync(){
 schema.questions.forEach(function(q){
  if(q.type!=='flag'&&skip(q.id))clearQ(q.id);
  if(q.requires&&answers[q.id]===q.requires.value&&answers[q.requires.field]!==q.requires.equals)delete answers[q.id];
 });
 if(answers.F1_none==='1')delete answers.F1;
 if(answers.F2_none==='1')delete answers.F2;
 if((answers.Q14||[]).indexOf('2')<0)q14Confirmed=false;
}
function short(t){t=plain(t);return t.length>40?t.slice(0,40)+'…':t;}
function pageName(p){return p.case&&p.kind!=='notes'?p.case:p.title;}
function unanswered(i){
 var out=[];
 (pages[i].ids||[]).forEach(function(id){
  var q=byId[id];if(skip(id))return;
  fieldsOf(q).forEach(function(f){if(optional(f.id)||hasValue(answers[f.id]))return;out.push({id:f.id,qid:q.id,label:short(q.title)+(f.label?' / '+f.label.split(' / ').pop():'')});});
  if(id==='Q14'&&(answers.Q14||[]).indexOf('2')>=0&&!q14Confirmed)out.push({id:'q14confirm',qid:'Q14',label:'Q14 ②: 의무화한 경우인지 확인란'});
 });
 return out;
}
function anyAnswer(){return Object.keys(answers).some(function(k){return k!=='institution'&&hasValue(answers[k]);});}

/* ── 보기 그리기: 번호 표시를 눌러 선택 ── */
function splitNo(label){var m=/^([①-⑳])\s*(.*)$/.exec(label);return m?{n:String(m[1].charCodeAt(0)-0x245F),t:m[2]}:{n:'',t:label};}
function marker(type,n){return '<span class="mk'+(type==='checkbox'?' sq':'')+(n?'':' blank')+'" aria-hidden="true">'+n+'</span>';}
function optHtml(type,name,field,value,label,checked,disabled,textClass){
 var s=splitNo(label);
 return '<label class="opt"><input class="vh" type="'+type+'" name="'+name+'" data-field="'+field+'" value="'+value+'"'+(checked?' checked':'')+(disabled?' disabled':'')+'>'+marker(type,s.n)+'<span class="'+(textClass||'tx')+'">'+esc(s.t)+'</span></label>';
}
function choiceList(q,id){
 var type=q.type==='multi'?'checkbox':'radio',val=answers[id];
 return '<ul class="opts">'+q.options.map(function(o){
  var checked=Array.isArray(val)?val.indexOf(o.value)>=0:val===o.value;
  var dis=q.requires&&o.value===q.requires.value&&answers[q.requires.field]!==q.requires.equals;
  return '<li>'+optHtml(type,id,id,o.value,o.label,checked,dis)+'</li>';
 }).join('')+'</ul>';
}
function gridTable(q){
 var cols=q.options.length+1,group='',body='';
 var head='<thead><tr><th scope="col">구분</th>'+q.options.map(function(o){return '<th scope="col">'+esc(o.label)+'</th>';}).join('')+'</tr></thead>';
 q.rows.forEach(function(r){
  var parts=r.label.split(' / '),g=parts.length>1?parts[0]:'',label=parts.length>1?parts.slice(1).join(' / '):r.label;
  if(g&&g!==group){group=g;body+='<tr class="group"><th colspan="'+cols+'">'+esc(g)+'</th></tr>';}
  body+='<tr id="row_'+r.id+'"><th scope="row">'+esc(label)+'</th>'+q.options.map(function(o){
   return '<td>'+optHtml('radio',r.id,r.id,o.value,o.label,answers[r.id]===o.value,false,'cl')+'</td>';
  }).join('')+'</tr>';
 });
 return '<table class="grid">'+head+'<tbody>'+body+'</tbody></table>';
}
function textField(q){
 var v=answers[q.id]||'';
 if(q.id==='F1'||q.id==='F2'){
  var none=answers[q.id+'_none']==='1';
  return '<div class="textwrap"><textarea id="in_'+q.id+'" data-field="'+q.id+'" maxlength="'+q.maxLength+'" rows="6"'+(none?' disabled':'')+'>'+esc(v)+'</textarea>'+
   '<div class="textfoot"><label class="opt"><input class="vh" type="checkbox" data-flag="'+q.id+'_none"'+(none?' checked':'')+'>'+marker('checkbox','')+'<span class="tx">특별히 적을 내용 없음</span></label>'+
   '<span class="cnt"><span id="cnt_'+q.id+'">'+v.length+'</span> / '+q.maxLength+'자</span></div></div>';
 }
 var isUrl=q.type==='url';
 return '<div class="textwrap"><input id="in_'+q.id+'" type="'+(isUrl?'url':'text')+'" data-field="'+q.id+'" maxlength="'+q.maxLength+'" value="'+esc(v)+'" autocomplete="off"'+(isUrl?' placeholder="https://"':' class="code"')+'></div>';
}
function autoRule(q){if(q.type==='grid')return '각 행 1개 선택';if(q.type==='single')return '1개 선택';if(q.type==='multi')return q.max?'최대 '+q.max+'개 선택':'복수 선택';return '';}
function titleHtml(q){
 var t=q.title,m=/\s*\[([^\[\]]+)\]$/.exec(t),rule;
 if(m){rule=m[1];t=t.slice(0,m.index);}else rule=autoRule(q);
 return mark(esc(t)).replace(/__([\s\S]+?)__/g,'<u class="k">$1</u>')+(rule?' <span class="rule">['+esc(rule)+']</span>':'');
}
function question(q){
 if(skip(q.id))return '<div id="card_'+q.id+'" hidden></div>';
 var body=q.type==='grid'?gridTable(q):(q.type==='text'||q.type==='url')?textField(q):choiceList(q,q.id);
 if(q.id==='Q14'&&(answers.Q14||[]).indexOf('2')>=0)body+='<div class="confirm">'+optHtml('checkbox','q14confirm','','1','귀 대학이 친족관계 증빙자료 제출을 의무화한 경우임을 확인합니다.',q14Confirmed,false).replace('data-field=""','id="q14confirm"')+'</div>';
 if(q.id==='material_mode'&&answers.material_mode==='2')body+='<p class="msg">현재 이 설문에서는 파일을 받지 않습니다. 승인된 안전한 제출 경로가 별도로 안내된 경우에만 기존 파일을 최대 2개 제공하십시오. 경로가 안내되지 않았다면 파일 제공을 생략해도 됩니다.</p>';
 return '<section class="q" id="card_'+q.id+'"><h3>'+titleHtml(q)+'</h3>'+(q.help?'<div class="help">'+prose(q.help)+'</div>':'')+body+'</section>';
}
function review(){
 var miss=0;pages.forEach(function(p,i){if(!p.review)miss+=unanswered(i).length;});
 var h='<div class="rv"><p class="msg'+(miss?' err':'')+'">'+(miss?'응답하지 않은 문항이 '+miss+'개 있습니다. 해당 항목의 [수정]을 눌러 응답해 주십시오.':'입력한 내용을 확인한 뒤 아래 [제출]을 눌러 주십시오.')+'</p>';
 pages.forEach(function(p,i){
  if(p.review||!p.ids.length)return;var rows='';
  p.ids.forEach(function(id){var q=byId[id];if(skip(id))return;fieldsOf(q).forEach(function(f){
   var v=answers[f.id],txt;
   if(!hasValue(v))txt=(f.id==='F1'||f.id==='F2')&&answers[f.id+'_none']==='1'?'특별히 적을 내용 없음':optional(f.id)?'<span class="muted">(해당 없음)</span>':'<span class="none">미응답</span>';
   else{var vals=Array.isArray(v)?v:[v];txt=q.options?esc(vals.map(function(x){var o=q.options.filter(function(o){return o.value===x;})[0];return o?o.label:x;}).join(' / ')):esc(v).replace(/\n/g,'<br>');}
   rows+='<tr><th>'+esc(f.label?short(q.title)+' / '+f.label.split(' / ').pop():plain(q.title))+'</th><td>'+txt+'</td></tr>';
  });});
  h+='<h3><span>'+esc(pageName(p))+'</span><button type="button" class="link" data-go="'+i+'">[수정]</button></h3><table>'+rows+'</table>';
 });
 return h+'<p class="help" style="margin-top:18px">※ 제출 후에는 응답을 수정할 수 없습니다. 개인이나 사건을 알아볼 수 있는 정보가 있으면 제출 전에 삭제하십시오.</p></div>';
}
function render(focus){
 sync();var p=pages[index],h='',qs;
 $('pageTitle').textContent=p.title;$('pageCount').textContent=(index+1)+' / '+pages.length;
 $('progBar').style.width=Math.round(index/(pages.length-1)*100)+'%';
 if(p.review)h=review();
 else{
  qs=p.ids.map(function(id){return question(byId[id]);}).join('');
  if(p.case){
   var box='<section class="case'+(p.kind==='notes'?' notes':'')+'"><h3>'+esc(p.case)+'</h3><div class="cbody">'+prose(p.html)+'</div></section>';
   h=p.kind==='notes'?box+qs:'<div class="cl2"><div class="side">'+(p.warn?'<p class="warn">'+esc(p.warn)+'</p>':'')+box+'</div><div class="main">'+qs+'</div></div>';
  }else h=(p.html?'<div class="lead">'+prose(p.html)+'</div>':'')+qs;
  if(p.after)h+='<div class="help after">'+prose(p.after)+'</div>';
 }
 $('body').innerHTML=h;
 $('prev').disabled=index===0||busy;$('next').textContent=p.review?'제출':'다음';$('next').disabled=busy;$('status').innerHTML='';
 if(focus){$('pageTitle').focus();window.scrollTo(0,0);}
}
function refreshOne(id){var old=$('card_'+id);if(old)old.outerHTML=question(byId[id]);}
function refreshCards(){pages[index].ids.forEach(refreshOne);}

/* ── 입력 처리 ── */
$('body').addEventListener('input',function(e){
 touch();var id=e.target.dataset.field;if(!id||e.target.type==='radio'||e.target.type==='checkbox')return;
 var had=hasValue(answers[id]);answers[id]=e.target.value;
 var c=$('cnt_'+id);if(c)c.textContent=e.target.value.length;
 if((id==='F1'||id==='F2')&&had!==hasValue(e.target.value)){sync();refreshOne(id+'_kind');}
 var card=$('card_'+id);if(card&&hasValue(e.target.value))card.classList.remove('miss');
});
$('body').addEventListener('change',function(e){
 touch();var t=e.target;
 if(t.id==='q14confirm'){q14Confirmed=t.checked;return;}
 if(t.dataset.flag){
  var f=t.dataset.flag,base=f.replace('_none','');
  if(t.checked){answers[f]='1';if(hasValue(answers[base])&&!confirm('작성한 내용을 지우고 ‘특별히 적을 내용 없음’으로 응답하시겠습니까?')){t.checked=false;delete answers[f];return;}}
  else delete answers[f];
  sync();refreshOne(base);refreshOne(base+'_kind');return;
 }
 var id=t.dataset.field;if(!id||(t.type!=='radio'&&t.type!=='checkbox'))return;
 var q=byId[id]||schema.questions.filter(function(q){return (q.rows||[]).some(function(r){return r.id===id;});})[0];var msg='';
 if(q.type==='multi'){
  var arr=(answers[id]||[]).slice(),v=t.value;
  if(!t.checked)arr=arr.filter(function(x){return x!==v;});
  else if((q.exclusive||[]).indexOf(v)>=0){if(arr.length)msg='단독으로 선택하는 보기이므로 다른 선택을 해제했습니다.';arr=[v];}
  else{arr=arr.filter(function(x){return (q.exclusive||[]).indexOf(x)<0;});
   if(q.max&&arr.length>=q.max){t.checked=false;$('status').innerHTML='<p class="msg">최대 '+q.max+'개까지 선택할 수 있습니다. 다른 보기를 해제한 뒤 선택하십시오.</p>';return;}
   arr.push(v);}
  answers[id]=arr;
 }else answers[id]=t.value;
 var before=JSON.stringify(answers);sync();if(before!==JSON.stringify(answers))msg+=(msg?' ':'')+'조건이 바뀌어 해당하지 않는 후속 응답을 해제했습니다.';
 var val=t.value;refreshCards();
 var n=document.querySelector('input[data-field="'+id+'"][value="'+val+'"]');if(n)n.focus({preventScroll:true});
 $('status').innerHTML=msg?'<p class="msg">'+esc(msg)+'</p>':'';
});
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.go!==undefined){move(Number(b.dataset.go));return;}
 if(b.dataset.font!==undefined){setFont(Number(b.dataset.font));return;}
});
$('prev').onclick=function(){move(index-1);};
$('next').onclick=function(){
 if(busy)return;if(index===pages.length-1){submit();return;}
 var miss=unanswered(index);if(miss.length){showMissing(miss);return;}
 move(index+1);
};
function showMissing(miss){
 miss.forEach(function(m){var c=$('card_'+m.qid);if(c)c.classList.add('miss');var r=$('row_'+m.id);if(r)r.classList.add('miss');});
 $('status').innerHTML='<p class="msg">응답하지 않은 문항이 '+miss.length+'개 있습니다. <span style="color:var(--red)">← 응답이 필요합니다</span> 표시가 있는 문항에 응답해 주십시오. 답하기 어려운 문항은 ‘확인 곤란’ 또는 ‘응답 유보’를 선택해 주십시오.</p>';
 var first=$('row_'+miss[0].id)||$('card_'+miss[0].qid);if(first&&first.scrollIntoView)first.scrollIntoView({block:'center'});
}
function move(i){if(busy||pending)return;index=Math.max(0,Math.min(pages.length-1,i));render(true);}
function setFont(d){var sizes=[14,15,17,19],cur=1;try{cur=Number(localStorage.getItem('survey_font')||1);}catch(e){}cur=Math.max(0,Math.min(sizes.length-1,cur+d));document.documentElement.style.fontSize=sizes[cur]+'px';try{localStorage.setItem('survey_font',cur);}catch(e){}}

/* ── 제출 ── */
function firstGap(){for(var i=0;i<pages.length-1;i++){if(unanswered(i).length)return i;}return -1;}
function freeze(v){document.querySelectorAll('#workspace input,#workspace textarea,#workspace button').forEach(function(el){el.disabled=v;});if(!v)render(false);}
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.floor(Math.random()*16);return (c==='x'?r:(r&3|8)).toString(16);});}
function submit(){
 if(!pending){
  var g=firstGap();if(g>=0){index=g;render(true);showMissing(unanswered(g));return;}
  var u=['url1','url2'];for(var i=0;i<u.length;i++){if(answers[u[i]]&&!/^https?:\/\/[^\s\/@]+(?:\/[^\s]*)?$/i.test(answers[u[i]])){index=pages.findIndex(function(p){return p.ids.indexOf('url1')>=0;});render(true);$('status').innerHTML='<p class="msg err">공개 규정 주소는 http:// 또는 https://로 시작하는 주소로 입력하십시오.</p>';return;}}
  sync();pending={requestId:uuid(),version:schema.version,mode:MODE,startedAt:STARTED||new Date().toISOString(),answers:JSON.parse(JSON.stringify(answers)),q14MandatoryConfirmed:q14Confirmed};
 }
 busy=true;freeze(true);$('status').innerHTML='<p class="msg">응답을 접수하고 있습니다. 창을 닫지 마십시오.</p>';
 var settled=false;
 var timer=setTimeout(function(){if(!settled)retry('접수 확인이 지연되고 있습니다.');},45000);
 function retry(msg){if(completed)return;busy=false;$('next').disabled=false;$('next').textContent='다시 제출';$('status').innerHTML='<p class="msg err">'+esc(msg)+' [다시 제출]을 눌러 주십시오. 같은 응답이 두 번 저장되지는 않습니다.</p>';}
 function success(r){
  settled=true;clearTimeout(timer);if(completed)return;
  if(!r||!r.ok){if(r&&r.retryable===false){pending=null;busy=false;freeze(false);$('status').innerHTML='<p class="msg err">'+esc(r.message)+'</p>';}else retry(r&&r.message||'접수 결과를 확인하지 못했습니다.');return;}
  completed=true;busy=false;pending=null;$('workspace').hidden=true;$('done').hidden=false;
  $('done').innerHTML='<div class="secbar"><h2>'+(r.test?'시험응답 접수 완료':'응답 접수 완료')+'</h2></div>'+
   '<table class="info-table"><tr><th>접수번호</th><td>'+esc(r.receipt)+'</td></tr><tr><th>접수일시</th><td>'+esc(new Date().toLocaleString('ko-KR'))+'</td></tr></table>'+
   '<p>응답이 정상적으로 접수되었습니다. 접수번호는 문의 시 필요할 수 있으니 기록해 두시기 바랍니다.</p><p>조사에 협조해 주셔서 감사합니다. 이 창을 닫으셔도 됩니다.</p>'+
   '<div class="btns"><button type="button" onclick="window.print()">인쇄</button></div>';
  $('done').focus();window.scrollTo(0,0);
 }
 var ctrl=window.AbortController?new AbortController():null;if(ctrl)setTimeout(function(){ctrl.abort();},44000);
 fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pending),redirect:'follow',signal:ctrl?ctrl.signal:undefined})
  .then(function(r){return r.json();}).then(success)
  .catch(function(){settled=true;clearTimeout(timer);retry('연결 문제로 접수 결과를 확인하지 못했습니다.');});
}
window.addEventListener('beforeunload',function(e){if(!completed&&(anyAnswer()||pending)){e.preventDefault();e.returnValue='';}});

/* ── 시작 ── */
setFont(0);
try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('survey_draft_')===0)localStorage.removeItem(k);});}catch(e){}
function fail(msg){$('loading').className='msg err';$('loading').textContent=msg;}
function start(st){
 config=st.config||{};MODE=st.mode;
 if(st.version!==schema.version){fail('설문 페이지와 서버의 문항 버전이 다릅니다('+schema.version+' / '+st.version+'). 담당 기관에 문의하십시오.');return;}
 if(!st.ok){fail(st.message||'현재 설문을 접수하지 않습니다.');return;}
 document.body.classList.toggle('marks',MODE==='test');
 $('loading').hidden=true;$('workspace').hidden=false;$('testLine').hidden=MODE!=='test';
 $('versionLine').textContent=MODE==='test'?'최종 문안 검토본 v0.8 · 대교협 승인 전':'';
 if(PREFILL)answers.institution=PREFILL;
 render(false);
}
if(/XXXXXXXX/.test(ENDPOINT))fail('설문 서버 주소가 설정되지 않았습니다. 담당 기관에 문의하십시오.');
else{
 /* 보안망이 연결을 끊지 않고 붙잡아 두는 경우를 대비해 20초 안에 응답이 없으면 안내 */
 var NET_MSG='설문 서버에 연결할 수 없습니다. 잠시 후 새로고침해 주십시오. 계속되면 기관 보안망에서 Google(script.google.com) 접속이 차단되었는지 확인하거나 담당 기관에 문의하십시오.';
 var cctrl=window.AbortController?new AbortController():null,cdone=false;
 var ctimer=setTimeout(function(){if(cdone)return;cdone=true;if(cctrl)cctrl.abort();fail(NET_MSG);},20000);
 fetch(ENDPOINT+'?action=config&t='+Date.now(),{cache:'no-store',redirect:'follow',signal:cctrl?cctrl.signal:undefined}).then(function(r){return r.json();})
  .then(function(st){if(cdone)return;cdone=true;clearTimeout(ctimer);start(st);})
  .catch(function(){if(cdone)return;cdone=true;clearTimeout(ctimer);fail(NET_MSG);});
}
</script>
</body>
</html>
