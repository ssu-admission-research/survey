<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#1f3b63;--navy-d:#17304f;--line:#d6dbe3;--line-d:#aeb8c6;--bg:#f2f4f7;--text:#1c232e;--muted:#5c6878;--th:#eef2f7;--sel:#e8f0fa;--sel-line:#4a73b3;--warn-bg:#fff8e5;--warn-line:#e3c56d;--err:#b3261e;--ok:#1d6b3d;--okbg:#edf7f0}
html{font-size:16px;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--text);background:var(--bg);line-height:1.7;-webkit-text-size-adjust:100%;word-break:keep-all}
body{margin:0}*{box-sizing:border-box}
h1,h2,h3,h4{font-weight:700;line-height:1.4}h4{margin:20px 0 6px;font-size:1rem;color:var(--navy)}
p{margin:8px 0}a{color:var(--navy)}
button{font:inherit;cursor:pointer;color:var(--navy);background:#fff;border:1px solid var(--line-d);border-radius:3px;padding:9px 18px;min-height:42px}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}button.primary:hover{background:var(--navy-d)}
button:disabled{opacity:.45;cursor:default}button.small{min-height:34px;padding:5px 12px;font-size:.9rem}
button.link{border:0;background:none;padding:0;min-height:0;text-decoration:underline;color:var(--muted);font-size:.875rem}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;background:#fff;padding:8px 12px;z-index:50;border:2px solid var(--navy)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.topbar{background:#fff;border-bottom:1px solid var(--line);font-size:.875rem;color:var(--muted)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:42px;gap:12px}
.tools{display:flex;gap:6px}.tools button{min-height:28px;padding:2px 10px;font-size:.8rem}
.titlebar{background:var(--navy);color:#fff;padding:26px 0 24px}
.kicker{margin:0;font-size:.875rem;opacity:.85}
h1{margin:4px 0 0;font-size:1.5rem}
#versionLine{margin:8px 0 0;font-size:.8rem;opacity:.8}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-top:24px;padding-bottom:48px;align-items:start}
.side{position:sticky;top:16px}
.side-inner{background:#fff;border:1px solid var(--line);padding:14px 12px}
.side-title{margin:0 0 8px 6px;font-weight:700;font-size:.95rem}
.steps{list-style:none;margin:0;padding:0}
.steps button{all:unset;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;width:100%;padding:7px 6px;font-size:.875rem;cursor:pointer;border-radius:3px;line-height:1.4}
.steps button:hover{background:var(--bg)}.steps li.cur button{background:var(--sel);font-weight:700}
.steps .no{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-d);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);background:#fff}
.steps li.cur .no{background:var(--navy);border-color:var(--navy);color:#fff}
.steps li.done .no{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .st{font-size:.72rem;padding:1px 6px;border-radius:2px;background:#f1f3f6;color:var(--muted)}
.steps li.done .st{background:var(--okbg);color:var(--ok)}.steps li.partial .st{background:var(--warn-bg);color:#7a5a00}
.prog{margin:12px 6px 0;font-size:.8rem;color:var(--muted)}
.prog .bar{height:6px;background:#e7ebf1;border-radius:3px;margin-top:4px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--navy)}
main{background:#fff;border:1px solid var(--line);padding:28px 36px 36px;min-width:0}
.mobile-nav{display:none;margin-bottom:14px}.mobile-nav select{width:100%;font:inherit;padding:9px;border:1px solid var(--line-d);background:#fff}
.pagehead{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:6px}
.count{font-size:.8rem;color:var(--muted)}
h2{margin:2px 0 0;font-size:1.3rem;color:var(--navy)}
.banner{border:1px solid var(--line-d);background:#f7f9fc;padding:12px 16px;margin:0 0 16px;font-size:.95rem}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.banner .actrow{margin:10px 0 0}
.info,.scenario{margin:16px 0 4px}
.scenario{border:1px solid var(--line-d);border-left:5px solid var(--navy);background:#f9fafc;padding:14px 20px;font-size:1rem}
.pc-note{background:#eef4fb;border:1px solid #c9daf0;padding:12px 16px;margin:0 0 18px;font-size:.95rem}
.info h3{margin:18px 0 6px;font-size:1.1rem}
.info-table{width:100%;border-collapse:collapse;font-size:.95rem;margin:12px 0}
.info-table th,.info-table td{border:1px solid var(--line-d);padding:9px 12px;vertical-align:top;text-align:left}
.info-table th{background:var(--th);width:160px;font-weight:600;white-space:nowrap}
.org{font-size:.9rem;color:var(--muted)}
.q{padding:22px 0;border-bottom:1px solid var(--line)}.q:last-of-type{border-bottom:0}
.q h3{margin:0 0 6px;font-size:1.05rem}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:2px;margin-left:8px;vertical-align:middle;background:#fbe9e7;color:var(--err)}
.help{font-size:.9rem;color:var(--muted);margin:0 0 12px}.help p{margin:4px 0}.help.after{margin-top:20px;padding-top:12px;border-top:1px dashed var(--line-d)}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:#fff;cursor:pointer;min-height:44px;line-height:1.5}
.opts label:hover{border-color:var(--line-d);background:#fafbfd}
.opts label:has(input:checked){background:var(--sel);border-color:var(--sel-line)}
.opts label:has(input:disabled){color:#9aa4b1;background:#fafbfc;cursor:not-allowed}
input[type=radio],input[type=checkbox]{width:18px;height:18px;margin:4px 0 0;accent-color:var(--navy);flex-shrink:0}
.qact{margin:8px 0 0;text-align:right}
.grid{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.grid th,.grid td{border:1px solid var(--line-d);padding:7px 8px;text-align:center;vertical-align:middle}
.grid thead th{background:var(--th);font-weight:600;font-size:.9rem}
.grid tbody th{text-align:left;font-weight:500;background:#fff;width:40%}
.grid tr.group th{background:#f6f8fb;font-weight:700;text-align:left;font-size:.9rem;color:var(--navy)}
.grid td label{display:flex;justify-content:center;align-items:center;min-height:36px;cursor:pointer;margin:-7px -8px;padding:7px 8px}
.grid td label input{margin:0}
.grid .cl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grid td:has(input:checked){background:var(--sel)}
.grid td.actions{width:52px}.grid th.actions{font-weight:400;color:var(--muted)}
.textwrap textarea,.textwrap input{width:100%;border:1px solid var(--line-d);padding:11px 12px;font:inherit;background:#fff;color:inherit;border-radius:0}
.textwrap textarea{min-height:170px;resize:vertical}.textwrap input.code{max-width:320px;font-size:1.1rem;letter-spacing:.05em}
.textwrap:focus-within textarea,.textwrap:focus-within input{border-color:var(--navy);outline:2px solid #c9daf0}
.count-chars{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
.confirm{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);cursor:pointer}
.notice{border:1px solid var(--warn-line);background:var(--warn-bg);padding:14px 18px;margin:14px 0}
.notice.ok{background:var(--okbg);border-color:#bfe0cb}.notice.err{background:#fdecea;border-color:#f0b3ad;color:var(--err)}
.notice ul{margin:6px 0 6px 20px;padding:0}.notice .actrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
#status{min-height:8px}
.btns{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:2px solid var(--navy)}
.btns button{min-width:130px}
.draft{font-size:.8rem;color:var(--muted);text-align:right;margin:8px 0 0}
.rv h3{margin:22px 0 8px;font-size:1rem;color:var(--navy);display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv dl{margin:0;display:grid;grid-template-columns:minmax(220px,2fr) 3fr;gap:4px 16px;font-size:.92rem}
.rv dt{color:var(--muted)}.rv dd{margin:0}.rv .none{color:var(--err);font-weight:600}.rv .muted{color:var(--muted)}
.muted{color:var(--muted)}
.done{border:1px solid var(--line-d);border-top:5px solid var(--ok);padding:28px 32px}.done h2{color:var(--ok)}
.receipt{font-size:1.1rem;font-family:ui-monospace,Consolas,monospace;background:#f6f8fb;padding:8px 12px;display:inline-block;border:1px solid var(--line)}
.foot{font-size:.8rem;color:var(--muted);text-align:center;padding:14px 20px 30px}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
@media(max-width:900px){
 .layout{grid-template-columns:1fr;gap:0;padding-top:12px}.side{display:none}.mobile-nav{display:block}
 main{padding:18px 16px 28px;border-left:0;border-right:0}.wrap{padding:0 12px}
 .titlebar{padding:18px 0}h1{font-size:1.2rem}
 .opts{grid-template-columns:1fr}
 .grid thead{display:none}.grid,.grid tbody,.grid tr,.grid th,.grid td{display:block;border:0;width:auto}
 .grid tr{border:1px solid var(--line-d);margin-bottom:10px}
 .grid tbody th{background:var(--th);padding:8px 10px;width:auto}
 .grid tr.group th{border:0;background:none;padding:6px 0 2px;margin-top:4px}
 .grid td{display:inline-block;width:50%;text-align:left;padding:2px 10px}
 .grid td label{justify-content:flex-start;gap:8px;margin:0;padding:8px 0}
 .grid .cl{position:static;width:auto;height:auto;clip:auto}
 .grid td.actions{width:100%;text-align:right;padding:2px 10px 8px}
 .rv dl{grid-template-columns:1fr}.rv dt{margin-top:8px}
 .btns{flex-wrap:wrap}.btns button{flex:1}
 .info-table th{width:110px;white-space:normal}
}
@media print{.topbar,.side,.btns,.mobile-nav,.tools,.qact{display:none}main{border:0}}
</style>

<body>
<a class="skip" href="#content">본문 바로가기</a>
<div class="topbar"><div class="wrap"><span>한국대학교육협의회 ｜ 숭실대학교 연구진</span><span class="tools"><button type="button" data-font="-1" aria-label="글자 작게">가−</button><button type="button" data-font="1" aria-label="글자 크게">가＋</button></span></div></div>
<header class="titlebar"><div class="wrap"><p class="kicker">대학입학전형 회피·배제 가이드라인 개선 연구</p><h1>대학입학전형 회피·배제 운영방식 및 개선 요구 조사</h1><p id="versionLine"></p></div></header>
<div class="wrap layout">
 <aside class="side" aria-label="설문 차례"><div class="side-inner"><p class="side-title">설문 차례</p><ol id="steps" class="steps"></ol><div class="prog"><span id="progText"></span><div class="bar"><i id="progBar" style="width:0"></i></div></div></div></aside>
 <main id="content">
  <div id="loading" class="banner">설문 정보를 불러오는 중입니다…</div>
  <div id="testBanner" class="banner warn" hidden>시험 운영 중입니다. 응답은 ‘시험응답’으로 저장되며 본조사 자료에 포함되지 않습니다.</div>
  <div id="restore" class="banner" hidden></div>
  <div id="workspace" hidden>
   <div class="mobile-nav"><label>항목 이동 <select id="jump"></select></label></div>
   <div class="pagehead"><span id="pageCount" class="count"></span><h2 id="pageTitle" tabindex="-1"></h2></div>
   <div id="body"></div>
   <div id="status" role="status" aria-live="polite"></div>
   <nav class="btns"><button id="prev" type="button">이전</button><button id="next" type="button" class="primary">다음</button></nav>
   <p id="draftInfo" class="draft"></p>
  </div>
  <div id="done" class="done" hidden tabindex="-1"></div>
 </main>
</div>
<footer class="foot">응답자 이름·개인 직급·연락처·서명은 받지 않습니다. 설문 응답 내용은 다른 응답자에게 공개하지 않습니다.</footer>
<noscript>이 설문에 응답하려면 브라우저에서 JavaScript를 허용해야 합니다.</noscript>
<script>
'use strict';
var schema=SCHEMA,config={},MODE='test';
var BOOT={institution:(function(){try{return String(new URLSearchParams(location.search).get('code')||'').slice(0,80);}catch(e){return '';}})()};
var byId={};schema.questions.forEach(function(q){byId[q.id]=q;});
var pages=schema.pages.concat([{title:'제출 전 확인',ids:[],review:true}]);
var DRAFT_KEY='survey_draft_'+schema.version;
var answers={},index=0,busy=false,pending=null,completed=false,q14Confirmed=false,ackPage=-1,draftTimer=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function prose(s){return (s||'').replace(/\{\{([A-Z_]+)\}\}/g,function(_,k){return esc(config[k]||'[승인 후 기재]');});}
function fieldsOf(q){return q.rows?q.rows.map(function(r){return {id:r.id,label:r.label};}):[{id:q.id,label:''}];}
function hasValue(v){return Array.isArray(v)?v.length>0:String(v==null?'':v).trim()!=='';}
function skip(id){return (id==='Q3'&&(answers.Q2||[]).indexOf('5')>=0)||((id==='Q9'||id==='Q13')&&answers.Q1_1==='2')||((id==='url1'||id==='url2')&&answers.material_mode!=='1');}
function optional(id){if(id==='url2')return true;if(id==='F1_kind')return !hasValue(answers.F1);if(id==='F2_kind')return !hasValue(answers.F2);return false;}
function clearQ(id){fieldsOf(byId[id]).forEach(function(f){delete answers[f.id];});}
function sync(){
 schema.questions.forEach(function(q){
  if(skip(q.id))clearQ(q.id);
  if(q.requires&&answers[q.id]===q.requires.value&&answers[q.requires.field]!==q.requires.equals)delete answers[q.id];
 });
 if(!hasValue(answers.F1))delete answers.F1_kind;
 if(!hasValue(answers.F2))delete answers.F2_kind;
 if((answers.Q14||[]).indexOf('2')<0)q14Confirmed=false;
}
function short(t){return t.length>42?t.slice(0,42)+'…':t;}
function unanswered(i){var out=[];(pages[i].ids||[]).forEach(function(id){var q=byId[id];if(skip(id))return;fieldsOf(q).forEach(function(f){if(optional(f.id)||hasValue(answers[f.id]))return;out.push({id:f.id,label:short(q.title)+(f.label?' / '+f.label.split(' / ').pop():'')});});});return out;}
function pageState(i){var p=pages[i];if(p.review||!p.ids.length)return 'info';var total=0,done=0;p.ids.forEach(function(id){if(skip(id))return;fieldsOf(byId[id]).forEach(function(f){if(optional(f.id))return;total++;if(hasValue(answers[f.id]))done++;});});if(!total)return 'info';return done===total?'done':done?'partial':'empty';}

/* ── 렌더링 ── */
function renderSteps(){
 var total=0,done=0;
 $('steps').innerHTML=pages.map(function(p,i){var st=pageState(i);if(st!=='info'){total++;if(st==='done')done++;}
  var mark=st==='done'?'완료':st==='partial'?'일부':st==='empty'?'미응답':'';
  return '<li class="'+(i===index?'cur ':'')+st+'"><button type="button" data-go="'+i+'"><span class="no">'+(i+1)+'</span><span class="nm">'+esc(p.title)+'</span>'+(mark?'<span class="st">'+mark+'</span>':'')+'</button></li>';}).join('');
 $('jump').innerHTML=pages.map(function(p,i){return '<option value="'+i+'"'+(i===index?' selected':'')+'>'+(i+1)+'. '+esc(p.title)+'</option>';}).join('');
 $('progText').textContent='응답 완료 페이지 '+done+' / '+total;$('progBar').style.width=(total?Math.round(done/total*100):0)+'%';
}
function choiceList(q,id){
 var type=q.type==='multi'?'checkbox':'radio',val=answers[id];
 return '<ul class="opts">'+q.options.map(function(o){var checked=Array.isArray(val)?val.indexOf(o.value)>=0:val===o.value;var dis=q.requires&&o.value===q.requires.value&&answers[q.requires.field]!==q.requires.equals;
  return '<li><label><input type="'+type+'" name="'+id+'" data-field="'+id+'" value="'+o.value+'"'+(checked?' checked':'')+(dis?' disabled':'')+'><span>'+esc(o.label)+'</span></label></li>';}).join('')+'</ul><p class="qact"><button type="button" class="link" data-clear="'+id+'">선택 해제</button></p>';
}
function gridTable(q){
 var cols=q.options.length+2,group='',body='';
 var head='<thead><tr><th scope="col">구분</th>'+q.options.map(function(o){return '<th scope="col">'+esc(o.label)+'</th>';}).join('')+'<th scope="col" class="actions">해제</th></tr></thead>';
 q.rows.forEach(function(r){var parts=r.label.split(' / ');var g=parts.length>1?parts[0]:'',label=parts.length>1?parts.slice(1).join(' / '):r.label;
  if(g&&g!==group){group=g;body+='<tr class="group"><th colspan="'+cols+'">'+esc(g)+'</th></tr>';}
  body+='<tr><th scope="row">'+esc(label)+'</th>'+q.options.map(function(o){return '<td><label><input type="radio" name="'+r.id+'" data-field="'+r.id+'" value="'+o.value+'"'+(answers[r.id]===o.value?' checked':'')+'><span class="cl">'+esc(o.label)+'</span></label></td>';}).join('')+'<td class="actions"><button type="button" class="link" data-clear="'+r.id+'">해제</button></td></tr>';});
 return '<table class="grid">'+head+'<tbody>'+body+'</tbody></table>';
}
function textField(q){var v=answers[q.id]||'';
 if(q.id.charAt(0)==='F')return '<div class="textwrap"><textarea id="in_'+q.id+'" data-field="'+q.id+'" maxlength="'+q.maxLength+'" rows="6" placeholder="3~5문장 이내 · 개인·사건을 특정하는 정보는 적지 마십시오">'+esc(v)+'</textarea><div class="count-chars"><span id="cnt_'+q.id+'">'+v.length+'</span> / '+q.maxLength+'자</div></div>';
 var isUrl=q.type==='url';
 return '<div class="textwrap"><input id="in_'+q.id+'" type="'+(isUrl?'url':'text')+'" data-field="'+q.id+'" maxlength="'+q.maxLength+'" value="'+esc(v)+'" autocomplete="off" placeholder="'+(isUrl?'https:// 로 시작하는 공개 주소':'공문에 기재된 기관코드')+'"'+(q.id==='institution'?' class="code"':'')+'></div>';
}
function question(q){if(skip(q.id))return '';
 var body=q.type==='grid'?gridTable(q):(q.type==='text'||q.type==='url')?textField(q):choiceList(q,q.id);
 if(q.id==='Q14'&&(answers.Q14||[]).indexOf('2')>=0)body+='<label class="confirm"><input type="checkbox" id="q14confirm"'+(q14Confirmed?' checked':'')+'><span>귀 대학이 친족관계 증빙자료 제출을 의무화한 경우임을 확인합니다.</span></label>';
 if(q.id==='material_mode'&&answers.material_mode==='2')body+='<div class="notice">현재 이 설문에서는 파일을 받지 않습니다. 승인된 안전한 제출 경로가 별도로 안내된 경우에만 기존 파일을 최대 2개 제공하십시오. 경로가 안내되지 않았다면 파일 제공을 생략해도 됩니다.</div>';
 var badge=q.id==='institution'?'<span class="badge">필수</span>':'';
 return '<section class="q" id="card_'+q.id+'"><h3>'+esc(q.title)+badge+'</h3>'+(q.help?'<div class="help">'+prose(q.help)+'</div>':'')+body+'</section>';
}
function review(){
 var miss=0;pages.forEach(function(p,i){if(!p.review)miss+=unanswered(i).length;});
 var h='<div class="rv"><div class="notice'+(miss?'':' ok')+'">'+(miss?'응답하지 않은 문항이 <strong>'+miss+'개</strong> 있습니다. 모든 문항은 건너뛸 수 있으므로 이대로 제출해도 접수됩니다. 수정하려면 항목 옆의 ‘수정’을 누르십시오.':'표시된 모든 문항에 응답했습니다. 아래 내용을 확인한 뒤 제출하십시오.')+'</div>';
 pages.forEach(function(p,i){if(p.review||!p.ids.length)return;var rows='';
  p.ids.forEach(function(id){var q=byId[id];if(skip(id))return;fieldsOf(q).forEach(function(f){var v=answers[f.id],txt;
   if(!hasValue(v))txt=optional(f.id)?'<span class="muted">(선택 · 미작성)</span>':'<span class="none">미응답</span>';
   else{var vals=Array.isArray(v)?v:[v];txt=q.options?esc(vals.map(function(x){var o=q.options.filter(function(o){return o.value===x;})[0];return o?o.label:x;}).join(' / ')):esc(v).replace(/\n/g,'<br>');}
   rows+='<dt>'+esc(f.label?short(q.title)+' / '+f.label.split(' / ').pop():q.title)+'</dt><dd>'+txt+'</dd>';});});
  h+='<h3>'+(i+1)+'. '+esc(p.title)+' <button type="button" class="link" data-go="'+i+'">수정</button></h3><dl>'+rows+'</dl>';});
 return h+'<p class="muted" style="margin-top:22px">제출 후에는 응답을 수정할 수 없습니다. 개인이나 사건을 알아볼 수 있는 정보가 있으면 제출 전에 삭제하십시오.</p></div>';
}
function render(focus){sync();var p=pages[index];
 $('pageTitle').textContent=p.title;$('pageCount').textContent=(index+1)+' / '+pages.length;
 $('body').innerHTML=p.review?review():(p.html?'<article class="'+(index===0?'info':'scenario')+'">'+prose(p.html)+'</article>':'')+p.ids.map(function(id){return question(byId[id]);}).join('')+(p.after?'<div class="help after">'+prose(p.after)+'</div>':'');
 $('prev').disabled=index===0||busy;$('next').textContent=p.review?'응답 제출':'다음';$('next').disabled=busy;$('status').innerHTML='';
 renderSteps();
 if(focus){$('pageTitle').focus();window.scrollTo(0,0);}
}
function refreshCards(){pages[index].ids.forEach(function(id){var old=$('card_'+id),html=question(byId[id]);if(old){if(html)old.outerHTML=html;else old.remove();}else if(html){render(false);}});}

/* ── 임시 저장 (응답자 브라우저에만 저장) ── */
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({answers:answers,q14:q14Confirmed,index:index,at:Date.now()}));$('draftInfo').textContent='이 브라우저에 자동 임시 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}catch(e){$('draftInfo').textContent='이 브라우저에서는 임시 저장을 사용할 수 없습니다. 창을 닫으면 작성 내용이 사라집니다.';}}
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(function(){saveDraft();renderSteps();},400);}
function loadDraft(){try{var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(d&&d.answers&&Object.keys(d.answers).length)return d;}catch(e){}return null;}
function dropDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}

/* ── 이벤트 ── */
$('body').addEventListener('input',function(e){var id=e.target.dataset.field;if(!id||(e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='INPUT')||e.target.type==='radio'||e.target.type==='checkbox')return;
 answers[id]=e.target.value;ackPage=-1;var c=$('cnt_'+id);if(c)c.textContent=e.target.value.length;scheduleDraft();});
$('body').addEventListener('change',function(e){
 if(e.target.id==='q14confirm'){q14Confirmed=e.target.checked;scheduleDraft();return;}
 var id=e.target.dataset.field;if(!id||(e.target.type!=='radio'&&e.target.type!=='checkbox'))return;
 var q=byId[id]||schema.questions.filter(function(q){return (q.rows||[]).some(function(r){return r.id===id;});})[0];var msg='';ackPage=-1;
 if(q.type==='multi'){var arr=(answers[id]||[]).slice(),v=e.target.value;
  if(!e.target.checked)arr=arr.filter(function(x){return x!==v;});
  else if((q.exclusive||[]).indexOf(v)>=0){if(arr.length)msg='단독 선택 보기이므로 기존 선택을 해제했습니다.';arr=[v];}
  else{arr=arr.filter(function(x){return (q.exclusive||[]).indexOf(x)<0;});if(q.max&&arr.length>=q.max){e.target.checked=false;$('status').innerHTML='<div class="notice">최대 '+q.max+'개까지 선택할 수 있습니다. 다른 보기를 해제한 뒤 선택하십시오.</div>';return;}arr.push(v);}
  answers[id]=arr;
 }else answers[id]=e.target.value;
 var before=JSON.stringify(answers);sync();if(before!==JSON.stringify(answers))msg+=' 조건이 바뀌어 해당하지 않는 후속 응답을 해제했습니다.';
 var val=e.target.value;refreshCards();
 var t=document.querySelector('input[data-field="'+id+'"][value="'+val+'"]');if(t)t.focus({preventScroll:true});
 $('status').innerHTML=msg?'<div class="notice">'+esc(msg.trim())+'</div>':'';scheduleDraft();
});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.clear!==undefined){delete answers[b.dataset.clear];ackPage=-1;sync();refreshCards();$('status').innerHTML='';scheduleDraft();return;}
 if(b.dataset.go!==undefined){move(Number(b.dataset.go));return;}
 if(b.dataset.font!==undefined){setFont(Number(b.dataset.font));return;}
 if(b.id==='goOn'){ackPage=index;move(index+1);return;}
 if(b.id==='stay'){var first=document.querySelector('[data-field="'+b.dataset.first+'"]');if(first){first.focus();if(first.scrollIntoView)first.scrollIntoView({block:'center'});}return;}
 if(b.id==='rsYes'){var d=loadDraft();if(d){answers=d.answers;if(BOOT.institution)answers.institution=BOOT.institution;q14Confirmed=!!d.q14;index=Math.min(d.index||0,pages.length-1);}$('restore').hidden=true;render(true);return;}
 if(b.id==='rsNo'){dropDraft();$('restore').hidden=true;$('draftInfo').textContent='';return;}
});
$('prev').onclick=function(){move(index-1);};
$('jump').onchange=function(e){move(Number(e.target.value));};
$('next').onclick=function(){if(busy)return;if(index===pages.length-1){submit();return;}
 var miss=unanswered(index);
 if(miss.length&&ackPage!==index){showMissing(miss);return;}
 move(index+1);};
function showMissing(miss){$('status').innerHTML='<div class="notice"><strong>이 페이지에 응답하지 않은 문항이 '+miss.length+'개 있습니다.</strong><ul>'+miss.map(function(m){return '<li>'+esc(m.label)+'</li>';}).join('')+'</ul><p>모든 문항은 유보하거나 건너뛸 수 있습니다. 확인이 어려우면 ‘확인 곤란’ 또는 ‘응답 유보’ 보기를 선택해 주십시오.</p><div class="actrow"><button type="button" id="stay" data-first="'+miss[0].id+'">돌아가서 응답</button><button type="button" id="goOn" class="primary">그대로 다음으로</button></div></div>';if($('status').scrollIntoView)$('status').scrollIntoView({block:'center'});$('stay').focus();}
function move(i){if(busy||pending)return;i=Math.max(0,Math.min(pages.length-1,i));
 if(i>0&&!hasValue(answers.institution)){index=0;render(true);$('status').innerHTML='<div class="notice err">기관코드를 입력해야 다음 단계로 이동할 수 있습니다.</div>';var el=$('in_institution');if(el)el.focus();return;}
 index=i;render(true);scheduleDraft();}
function setFont(d){var sizes=[14,16,18,20];var cur=0;try{cur=Number(localStorage.getItem('survey_font')||1);}catch(e){cur=1;}cur=Math.max(0,Math.min(sizes.length-1,cur+d));document.documentElement.style.fontSize=sizes[cur]+'px';try{localStorage.setItem('survey_font',cur);}catch(e){}}

/* ── 제출 ── */
function issue(){
 if(!hasValue(answers.institution))return {page:0,msg:'기관코드를 입력하십시오.'};
 if((answers.Q14||[]).indexOf('2')>=0&&!q14Confirmed)return {page:5,msg:'Q14 ②의 의무 제출 여부를 확인하거나 해당 선택을 해제하십시오.'};
 var u=['url1','url2'];for(var i=0;i<u.length;i++){if(answers[u[i]]&&!/^https?:\/\/[^\s\/@]+(?:\/[^\s]*)?$/i.test(answers[u[i]]))return {page:pages.length-2,msg:'공개 규정 주소는 http:// 또는 https://로 시작하는 주소로 입력하십시오.'};}
 return null;
}
function freeze(v){document.querySelectorAll('#workspace input,#workspace textarea,#workspace select,#workspace button').forEach(function(el){el.disabled=v;});if(!v)render(false);}
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.floor(Math.random()*16);return (c==='x'?r:(r&3|8)).toString(16);});}
function submit(){
 if(!pending){var err=issue();if(err){index=err.page;render(true);$('status').innerHTML='<div class="notice err">'+esc(err.msg)+'</div>';return;}
  sync();pending={requestId:uuid(),version:schema.version,mode:MODE,answers:JSON.parse(JSON.stringify(answers)),q14MandatoryConfirmed:q14Confirmed};}
 busy=true;freeze(true);$('status').innerHTML='<div class="notice">응답을 접수 중입니다. 창을 닫지 마십시오.</div>';
 var settled=false;
 var timer=setTimeout(function(){if(!settled)retry('접수 확인이 지연되고 있습니다. 같은 응답으로 다시 제출할 수 있습니다.');},45000);
 function retry(msg){if(completed)return;busy=false;$('next').disabled=false;$('next').textContent='같은 응답으로 다시 제출';$('status').innerHTML='<div class="notice err">'+esc(msg)+' 중복 저장은 방지됩니다. 창을 닫지 마십시오.</div>';}
 function success(r){settled=true;clearTimeout(timer);if(completed)return;
  if(!r||!r.ok){if(r&&r.retryable===false){pending=null;busy=false;freeze(false);$('status').innerHTML='<div class="notice err">'+esc(r.message)+'</div>';}else retry(r&&r.message||'접수 결과를 확인하지 못했습니다.');return;}
  completed=true;busy=false;pending=null;dropDraft();$('workspace').hidden=true;$('done').hidden=false;
  $('done').innerHTML='<h2>'+(r.test?'시험응답이 접수되었습니다.':'응답이 접수되었습니다.')+'</h2><p>접수번호</p><p><span class="receipt">'+esc(r.receipt)+'</span></p><p>접수번호는 문의 시 필요할 수 있으니 기록해 두시기 바랍니다. 협조해 주셔서 감사합니다. 이 창을 닫으셔도 됩니다.</p><p><button type="button" onclick="window.print()">이 화면 인쇄</button></p>';
  $('done').focus();window.scrollTo(0,0);
 }
 if(/XXXXXXXX/.test(ENDPOINT)){clearTimeout(timer);pending=null;busy=false;freeze(false);$('status').innerHTML='<div class="notice err">설문 서버 주소(ENDPOINT)가 설정되지 않았습니다. 관리자에게 문의하십시오.</div>';return;}
 var ctrl=window.AbortController?new AbortController():null;
 if(ctrl)setTimeout(function(){ctrl.abort();},44000);
 fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pending),redirect:'follow',signal:ctrl?ctrl.signal:undefined})
  .then(function(r){return r.json();}).then(success)
  .catch(function(){settled=true;clearTimeout(timer);retry('연결 문제로 접수 결과를 확인하지 못했습니다.');});
}
window.addEventListener('beforeunload',function(e){if(pending&&!completed){e.preventDefault();e.returnValue='';}});

/* ── 시작: 서버 설정을 받은 뒤 화면 표시 ── */
setFont(0);
function fail(msg){$('loading').className='banner warn';$('loading').textContent=msg;}
function start(st){
 config=st.config||{};MODE=st.mode;
 if(st.version!==schema.version){fail('설문 페이지와 서버의 문항 버전이 다릅니다('+schema.version+' / '+st.version+'). 관리자에게 문의하십시오.');return;}
 if(!st.ok){fail(st.message||'현재 설문을 접수하지 않습니다.');return;}
 $('loading').hidden=true;$('workspace').hidden=false;
 $('testBanner').hidden=MODE!=='test';
 $('versionLine').textContent=MODE==='test'?'최종 문안 검토본 v0.8 · 대교협 승인 전 · 시험 운영':'배포본 v0.8';
 if(BOOT.institution)answers.institution=BOOT.institution;
 var d=loadDraft();if(d){$('restore').hidden=false;
  $('restore').innerHTML='이 브라우저에 <strong>'+esc(new Date(d.at).toLocaleString('ko-KR'))+'</strong>에 임시 저장된 작성 내용이 있습니다. 이어서 작성하시겠습니까?<div class="actrow"><button type="button" id="rsYes" class="primary small">이어서 작성</button> <button type="button" id="rsNo" class="small">새로 작성</button></div>';}
 render(false);
}
if(/XXXXXXXX/.test(ENDPOINT))fail('설문 서버 주소(ENDPOINT)가 설정되지 않았습니다. 관리자에게 문의하십시오.');
else fetch(ENDPOINT+'?action=config&t='+Date.now(),{cache:'no-store',redirect:'follow'}).then(function(r){return r.json();}).then(start)
 .catch(function(){fail('설문 서버에 연결할 수 없습니다. 잠시 후 새로고침해 주시고, 계속되면 기관 보안망(Google 접속 차단) 여부를 확인하거나 담당 기관에 문의하십시오.');});
</script>
</body>
</html>
